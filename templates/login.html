<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Habyx — Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bangers&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f0f4ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 420px;
      }

      .logo {
        text-align: center;
        margin-bottom: 32px;
      }
      .logo h1 {
        font-family: "Bangers", cursive;
        font-size: 48px;
        letter-spacing: 3px;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .logo p {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 4px;
      }

      .card {
        background: white;
        border-radius: 24px;
        padding: 36px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }

      .tabs {
        display: flex;
        background: #f1f5f9;
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 28px;
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 8px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        color: #94a3b8;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab.active {
        background: white;
        color: #1e293b;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 7px;
        letter-spacing: 0.5px;
      }
      .form-group input {
        width: 100%;
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 14px;
        font-family: "Poppins", sans-serif;
        color: #1e293b;
        outline: none;
        transition: all 0.2s;
      }
      .form-group input:focus {
        border-color: #3b82f6;
        background: #eff6ff;
      }
      .password-field {
        position: relative;
      }
      .password-field input {
        padding-right: 72px;
      }
      .password-toggle {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: #3b82f6;
        cursor: pointer;
        font-family: "Poppins", sans-serif;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 6px;
      }
      .password-toggle:hover {
        color: #6366f1;
      }

      .btn {
        width: 100%;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 15px;
        font-weight: 700;
        font-family: "Poppins", sans-serif;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 6px;
      }
      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }

      .error-msg {
        background: #fef2f2;
        border: 1.5px solid #fecaca;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        color: #ef4444;
        margin-bottom: 16px;
        display: none;
      }
      .success-msg {
        background: #f0fdf4;
        border: 1.5px solid #bbf7d0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        color: #22c55e;
        margin-bottom: 16px;
        display: none;
      }

      .divider {
        text-align: center;
        font-size: 12px;
        color: #cbd5e1;
        margin: 20px 0;
        position: relative;
      }
      .divider::before,
      .divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 42%;
        height: 1px;
        background: #e2e8f0;
      }
      .divider::before {
        left: 0;
      }
      .divider::after {
        right: 0;
      }

      .features {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 28px;
      }
      .feature {
        text-align: center;
        font-size: 11px;
        color: #94a3b8;
      }
      .feature .icon {
        font-size: 20px;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <h1>HABYX</h1>
        <p>Your daily fitness companion</p>
      </div>

      <div class="card">
        <div class="tabs">
          <div class="tab active" onclick="switchTab('login')">Log In</div>
          <div class="tab" onclick="switchTab('register')">Register</div>
        </div>

        <!-- ERROR / SUCCESS -->
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <!-- LOGIN FORM -->
        <div id="loginForm">
          <div class="form-group">
            <label>USERNAME</label>
            <input
              type="text"
              id="login-username"
              placeholder="Enter your username"
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label>PASSWORD</label>
            <div class="password-field">
              <input
                type="password"
                id="login-password"
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('login-password', this)"
              >
                Show
              </button>
            </div>
          </div>
          <button class="btn" onclick="doLogin()">Log In →</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerForm" style="display: none">
          <div class="form-group">
            <label>USERNAME</label>
            <input
              type="text"
              id="reg-username"
              placeholder="Choose a username"
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label>PASSWORD</label>
            <div class="password-field">
              <input
                type="password"
                id="reg-password"
                placeholder="Choose a password"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('reg-password', this)"
              >
                Show
              </button>
            </div>
          </div>
          <div class="form-group">
            <label>CONFIRM PASSWORD</label>
            <div class="password-field">
              <input
                type="password"
                id="reg-confirm"
                placeholder="Confirm your password"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('reg-confirm', this)"
              >
                Show
              </button>
            </div>
          </div>
          <button class="btn" onclick="doRegister()">Create Account →</button>
        </div>

        <div class="divider">your fitness journey starts here</div>

        <div class="features">
          <div class="feature">
            <div class="icon">⭐</div>
            Earn XP
          </div>
          <div class="feature">
            <div class="icon">📅</div>
            Plan Week
          </div>
          <div class="feature">
            <div class="icon">💪</div>
            Track Habits
          </div>
          <div class="feature">
            <div class="icon">🏆</div>
            Level Up
          </div>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tab) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".tab")
          [tab === "login" ? 0 : 1].classList.add("active");
        document.getElementById("loginForm").style.display =
          tab === "login" ? "block" : "none";
        document.getElementById("registerForm").style.display =
          tab === "register" ? "block" : "none";
        hideMessages();
      }

      function showError(msg) {
        const el = document.getElementById("errorMsg");
        el.innerText = msg;
        el.style.display = "block";
        document.getElementById("successMsg").style.display = "none";
      }

      function showSuccess(msg) {
        const el = document.getElementById("successMsg");
        el.innerText = msg;
        el.style.display = "block";
        document.getElementById("errorMsg").style.display = "none";
      }

      function hideMessages() {
        document.getElementById("errorMsg").style.display = "none";
        document.getElementById("successMsg").style.display = "none";
      }

      function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const shouldShow = input.type === "password";

        input.type = shouldShow ? "text" : "password";
        button.innerText = shouldShow ? "Hide" : "Show";
      }

      function doLogin() {
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;

        if (!username || !password) {
          showError("Please fill in all fields.");
          return;
        }

        fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              showSuccess(
                "Welcome back, " + data.username + "! Redirecting...",
              );
              setTimeout(() => (window.location.href = "/dashboard"), 1000);
            } else {
              showError(data.error || "Invalid username or password.");
            }
          })
          .catch(() => showError("Something went wrong. Please try again."));
      }

      function doRegister() {
        const username = document.getElementById("reg-username").value.trim();
        const password = document.getElementById("reg-password").value;
        const confirm = document.getElementById("reg-confirm").value;

        if (!username || !password || !confirm) {
          showError("Please fill in all fields.");
          return;
        }
        if (password !== confirm) {
          showError("Passwords do not match.");
          return;
        }
        if (password.length < 4) {
          showError("Password must be at least 4 characters.");
          return;
        }
        if (username.length < 3) {
          showError("Username must be at least 3 characters.");
          return;
        }

        fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              showSuccess("Account created! Redirecting...");
              setTimeout(() => (window.location.href = "/dashboard"), 1000);
            } else {
              showError(data.error || "Registration failed.");
            }
          })
          .catch(() => showError("Something went wrong. Please try again."));
      }

      // Allow Enter key to submit
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          if (document.getElementById("loginForm").style.display !== "none")
            doLogin();
          else doRegister();
        }
      });
    </script>
  </body>
</html>
